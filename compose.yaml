services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventloom
      POSTGRES_USER: eventloom
      POSTGRES_PASSWORD: eventloom-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventloom -d eventloom"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://eventloom:eventloom-local-only@db:5432/eventloom
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      start_period: 180s
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
